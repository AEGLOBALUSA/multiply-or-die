<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Kepemimpinan — Multiply or Die</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="hero" style="padding: 24px 16px;">
  <h1>Profil Kepemimpinan</h1>
  <p id="greeting"></p>
</div>

<div class="container">
  <div id="loading" class="form-section text-center">
    <p>Memuat profil Anda...</p>
  </div>

  <div id="error-screen" class="form-section hidden">
    <div class="message message-error" id="error-text"></div>
  </div>

  <div id="form-section" class="form-section hidden">
    <h2>Lengkapi Profil Anda</h2>
    <p style="color: var(--text-light); font-size: 0.9rem;">Lengkapi minimal 4 dari 6 bidang untuk membuka akses Masterclass gratis.</p>

    <div class="progress-bar mt-16">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <p class="progress-text" id="progress-text">0 dari 6 terisi</p>

    <div id="form-message" class="mt-16"></div>

    <form id="profile-form" class="mt-16">
      <div class="form-group">
        <label for="church_size">Ukuran Gereja</label>
        <select id="church_size" name="church_size">
          <option value="">— Pilih —</option>
          <option value="Under 50">Di bawah 50</option>
          <option value="50–100">50–100</option>
          <option value="100–300">100–300</option>
          <option value="300–800">300–800</option>
          <option value="800+">800+</option>
        </select>
      </div>

      <div class="form-group">
        <label for="years_in_ministry">Lama Pelayanan</label>
        <select id="years_in_ministry" name="years_in_ministry">
          <option value="">— Pilih —</option>
          <option value="0–2">0–2 tahun</option>
          <option value="3–5">3–5 tahun</option>
          <option value="6–10">6–10 tahun</option>
          <option value="11–20">11–20 tahun</option>
          <option value="20+">20+ tahun</option>
        </select>
      </div>

      <div class="form-group">
        <label for="leadership_role">Peran Kepemimpinan</label>
        <select id="leadership_role" name="leadership_role">
          <option value="">— Pilih —</option>
          <option value="Senior Pastor">Pendeta Senior</option>
          <option value="Associate Pastor">Pendeta Asosiasi</option>
          <option value="Church Planter">Perintis Gereja</option>
          <option value="Ministry Leader">Pemimpin Pelayanan</option>
          <option value="Other">Lainnya</option>
        </select>
      </div>

      <div class="form-group">
        <label for="biggest_challenge">Tantangan Terbesar</label>
        <select id="biggest_challenge" name="biggest_challenge">
          <option value="">— Pilih —</option>
          <option value="Growing past current size">Bertumbuh melewati ukuran saat ini</option>
          <option value="Developing leaders">Mengembangkan pemimpin</option>
          <option value="Building systems">Membangun sistem</option>
          <option value="Funding and resources">Pendanaan dan sumber daya</option>
          <option value="Personal burnout">Kelelahan pribadi</option>
        </select>
      </div>

      <div class="form-group">
        <label for="team_size">Ukuran Tim</label>
        <select id="team_size" name="team_size">
          <option value="">— Pilih —</option>
          <option value="0 (solo)">0 (sendiri)</option>
          <option value="1–3">1–3</option>
          <option value="4–10">4–10</option>
          <option value="11–25">11–25</option>
          <option value="25+">25+</option>
        </select>
      </div>

      <div class="form-group">
        <label for="training_preference">Preferensi Pelatihan</label>
        <select id="training_preference" name="training_preference">
          <option value="">— Pilih —</option>
          <option value="Video">Video</option>
          <option value="Written guides">Panduan tertulis</option>
          <option value="Live workshops">Workshop langsung</option>
          <option value="One-on-one coaching">Coaching satu-satu</option>
          <option value="Peer groups">Kelompok sebaya</option>
        </select>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Simpan Profil</button>
    </form>
  </div>

  <!-- Success / Masterclass Unlocked Screen -->
  <div id="success-screen" class="form-section confirmation hidden">
    <svg class="checkmark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="#2d8a4e"/>
      <path d="M20 32l8 8 16-16" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 id="success-title"></h2>
    <p id="success-message"></p>
    <a id="masterclass-link" class="btn btn-primary mt-16 hidden" style="display:none; text-decoration:none;">Mulai Masterclass</a>
  </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
